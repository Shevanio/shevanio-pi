name: Bug report
description: Report a reproducible shevanio-pi defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve shevanio-pi. Do not include secrets or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable steps and relevant output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include shevanio-pi source revision, Pi version, Node.js version, package manager, and operating system.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or links that help explain the defect.
